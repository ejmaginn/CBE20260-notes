format:
  html:
    theme: cosmo         # Options: cosmo, flatly, journal, lumen, paper
    fontsize: 1.1em      # Slightly larger text for reading
    linestretch: 1.5     # More breathing room between lines
    mainfont: "Georgia"  # System fonts for HTML
    toc: true
    number-sections: true
    keep-ipynb: true
    code-tools: false

    
  pdf:
    documentclass: scrartcl
    papersize: letter
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    mainfont: "TeX Gyre Pagella"
    colorlinks: false
    linkcolor: black
    fig-width: 4
    fig-align: center
    fig-cap-location: bottom
    fig-pos: 'H'               # Forces figures to stay put
    monofont: "Courier New"    # Optional: nicer code font
    
    # MERGED HEADER SECTION BELOW:
    include-in-header:
      - latex/preamble.tex     # Your original file
      - text: |                # The new fix for code wrapping
          \usepackage{fvextra}
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
crossref:
  fig-title: "Fig."   # caption prefix: Fig. 1
  fig-prefix: "Fig."  # inline ref: Fig. 1

  eq-title:  "Eq."    # caption prefix: Eq. 1
  eq-prefix: "Eq."       # inline ref: Eq.1
#  eq-prefix: ""       # inline ref: just 1 (we'll add Eq./eq. manually)


resources:
  - "*/images/**"
  - "**/*.ipynb"

# resources: - */images/** → tells Quarto to copy any images/ folder inside any subdirectory (e.g., class01/images/, class02/images/) into the built site so your image links work.
bibliography: references.bib